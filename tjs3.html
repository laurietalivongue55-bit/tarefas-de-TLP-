  <!-- Conteúdo -->
  <div class="container" style="margin-left:220px; padding-top:30px;">
    <h1 class="text-primary text-center">Tabela dos Alunos</h1>
   <!-- Tabela Bootstrap -->
    <table class="table table-hover table-bordered align-middle text-center" id="tabelaAlunos">
      <thead class="table-primary">
        <tr>
          <th scope="col">Número</th>
          <th scope="col">Nome</th>
          <th scope="col">Sala</th>
          <th scope="col">Turma</th>
          <th scope="col">Idade</th>
          <th scope="col">Disciplina</th>
          <th scope="col">Nota1</th>
          <th scope="col">Nota2</th>
          <th scope="col">Nota3</th>
          <th scope="col">Média</th>
          <th scope="col">situação</th>
        </tr>
      </thead>
      <tbody>
        <!-- Linhas serão adicionadas via JavaScript -->
      </tbody>
    </table>
  </div>

   
    
  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script> 
        // Mostrar alunos na tabela
const tabela = document.getElementById("tabelaAlunos");
if (tabela) {
  let alunos = JSON.parse(localStorage.getItem("alunos")) || [];
  const tbody = tabela.querySelector("tbody");
  let soma = 0;

  alunos.forEach(aluno => {
    soma += aluno.media;
    const linha = document.createElement("tr");
    linha.innerHTML = `
      <td>${aluno.numero}</td>
      <td>${aluno.nome}</td>
      <td>${aluno.sala}</td>
      <td>${aluno.turma}</td>
      <td>${aluno.idade}</td>
      <td>${aluno.disciplina}</td>
      <td>${aluno.nota1}</td>
      <td>${aluno.nota2}</td>
      <td>${aluno.nota3}</td>
      <td>${aluno.media.toFixed(2)}</td>
      <td>${aluno.situacao}</td>
    `;
    tbody.appendChild(linha);
  });

  if (alunos.length > 0) {
    document.getElementById("totalAlunos").textContent = "Total de alunos: " + alunos.length;
    document.getElementById("mediaTurma").textContent = "Média da turma: " + (soma / alunos.length).toFixed(2);
  }
}

    </script>
</body>
