<!DOCTYPE html>

<head>  <meta charset="UTF-8">

  <style>
       
    /* Fundo da página e cor do texto */
body {
  background-color: white;  /* página branca */
  color: black;             /* letra preta */
}


    /* Nav topo - horizontal */
    .topnav {
      background-color: blue;
      overflow: hidden;
      display: flex;
      justify-content: flex-start; /* força alinhamento à esquerda */
      border: 10px solid blue;
}

.topnav a {
  color: white;
  text-align: center;
  padding: 14px 20px;
  text-decoration: none;
}



    .topnav a:hover {
      background-color: gray;
    }

    /* Layout principal */
    .container {
      display: flex;
    }

    /* Nav lateral - vertical */
    .sidenav {
      margin: 0%;
      width: 200px;
      background-color:blue;
      padding-top: 20px;
      min-height: 100vh;
    }

    .sidenav a {
      display: block; /* garante um abaixo do outro */
      color:white;
      padding: 10px 15px;
      text-decoration: none;
    }
    .sidenav a:hover {
      background-color: gray;
    }

    /* Conteúdo */
    .content {
      margin: 40px auto;
      width: 80%;
      background-color: white;
      padding: 30px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      text-align: center;
    }

    
    .content h1{ 
      color: #0044cc;
    }

    .content p {
      font-size: 18px;
      color:black;
    }


  </style>



</head>
<body>
  <!-- Nav topo -->
