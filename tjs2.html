</head>
<body class="bg-light">

  <!-- Nav topo -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="home.html">Home</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="tjs1.html">T1</a></li>
          <li class="nav-item"><a class="nav-link" href="tjs2.html">T2</a></li>
          <li class="nav-item"><a class="nav-link" href="tjs3.html">T3</a></li>
          <li class="nav-item"><a class="nav-link" href="tjs4.html">T4</a></li>

      </div>

  <!-- Nav lateral -->
  <div class="bg-primary text-white p-3" style="width:200px; height:100vh; position:fixed; top:0; left:0;">
    <h5>Menu</h5>
    <a href="home.html" class="text-white d-block mb-2">Home</a>
    <a href="Itrimestre.html" class="text-white d-block mb-2">I Trimestre</a>
    <a href="IItrimestre.html" class="text-white d-block mb-2">II Trimestre</a>
    <a href="fim.html" class="text-white d-block mb-2">Fim</a>
  </div>

  <!-- Conteúdo principal -->
  <div class="container" style="margin-left:220px; padding-top:30px;">
    <h1 class="text-primary text-center">Registro de Alunos</h1>

    <!-- FORMULÁRIO -->
    <form id="formAluno" class="mt-4">
      <div class="mb-3">
        <label for="numero" class="form-label">Número</label>
        <input type="number" class="form-control" id="numero" required>
      </div>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>
      <div class="mb-3">
        <label for="sala" class="form-label">Sala</label>
        <input type="text" class="form-control" id="sala" required>
      </div>
      <div class="mb-3">
        <label for="turma" class="form-label">Turma</label>
        <input type="text" class="form-control" id="turma" required>
      </div>
      <div class="mb-3">
        <label for="idade" class="form-label">Idade</label>
        <input type="number" class="form-control" id="idade" required>
      </div>
      <div class="mb-3">
        <label for="disciplina" class="form-label">Disciplina</label>
        <input type="text" class="form-control" id="disciplina" required>
      </div>
      <div class="mb-3">
        <label for="nota1" class="form-label">Nota 1</label>
        <input type="number" class="form-control" id="nota1" required>
      </div>
      <div class="mb-3">
        <label for="nota2" class="form-label">Nota 2</label>
        <input type="number" class="form-control" id="nota2" required>
      </div>
      <div class="mb-3">
        <label for="nota3" class="form-label">Nota 3</label>
        <input type="number" class="form-control" id="nota3" required>
      </div>

      <button type="submit" class="btn btn-success">Salvar Aluno</button>
    </form>
  </div>

  <!-- Scripts -->
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Mostrar alunos na tabela
  const form = document.getElementById("formAluno");
      if (form) {
        form.addEventListener("submit", function(event) {
          event.preventDefault();
          
          const numero = document.getElementById("numero").value;
          const nome = document.getElementById("nome").value;
          const sala = document.getElementById("sala").value;
          const turma = document.getElementById("turma").value;
          const idade = document.getElementById("idade").value;
          const disciplina = document.getElementById("disciplina").value;
          const nota1 = parseFloat(document.getElementById("nota1").value);
          const nota2 = parseFloat(document.getElementById("nota2").value);
          const nota3 = parseFloat(document.getElementById("nota3").value);

          const media = (nota1 + nota2 + nota3) / 3;
          
          let situacao = "";
          if (media >= 10) {
            situacao = "Aprovado";
          } else if (media >= 8) {
            situacao = "Recurso";
          } else {
            situacao = "Reprovado";
          }
          
          let alunos = JSON.parse(localStorage.getItem("alunos")) || [];
          
          if (alunos.length < 10) {
            alunos.push({numero, nome, sala, turma, idade, disciplina, nota1, nota2, nota3, media, situacao});
            localStorage.setItem("alunos", JSON.stringify(alunos));
            form.reset();
          } else {
            alert("Já foram adicionados 10 alunos!");
          }
        });
      }
    </script>
  </body>
  </html>
