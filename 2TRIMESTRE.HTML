<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>II Trimestre</title>
</head>
    <style>
       
    /* Fundo da página e cor do texto */
body {
  background-color: white;  /* página branca */
  color: black;             /* letra preta */
}

    /* Nav topo - horizontal */
    .topnav {
      background-color: blue;
      overflow: hidden;
      display: flex;
      justify-content: flex-start; /* força alinhamento à esquerda */
      border: 10px solid blue;
}

.topnav a {
  color: white;
  text-align: center;
  padding: 14px 20px;
  text-decoration: none;
}



    .topnav a:hover {
      background-color: gray;
    }

    /* Layout principal */
    .container {
      display: flex;
    }

    /* Nav lateral - vertical */
    .sidenav {
      margin: 0%;
      width: 200px;
      background-color:blue;
      padding-top: 20px;
      min-height: 100vh;
    }

    .sidenav a {
      display: block; /* garante um abaixo do outro */
      color:white;
      padding: 10px 15px;
      text-decoration: none;
    }
    .sidenav a:hover {
      background-color: gray;
    }
    
  
    /* Conteúdo */
    .content {
      margin: 40px auto;
      width: 80%;
      background-color: white;
      padding: 30px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      text-align: center;
    }

    
    .content h1{ 
      color: #0044cc;
    }

    .content p {
      font-size: 18px;
      color:black;
    }

  /* Tarefas no canto superior direito */
    .tarefas {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }

    .tarefas a {
      text-decoration: none;
      color: white;
      background-color: blue;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .tarefas a:hover {
      background-color: gray; /* Hover cinza */
    }
  </style>
</head>
<body>
  <!-- Nav topo -->
  <div class="topnav">
    <a href="index.html">Home</a>
    <a href="sobre mim.html">Sobre mim</a>
    <a href="contacto.html">Contactos</a>
  </div>

  <div class="container">
    <!-- Nav lateral -->
    <div class="sidenav">
      <a href="index.HTML">PÁGINA INICIAL</a>
      <a href="1TRIMESTRE.HTML">I TRIMESTRE</a>
      <a href="3TRIMESTRE.HTML">III TRIMESTRE</a>
      <a href="FIM.HTML">FIM</a>
    </div>

     <!-- Links das tarefas no centro -->
    <div class="tarefas">
      <a href="T1.html">T1</a>
      <a href="T2.html">T2</a>
      <a href="T3.html">T3</a>
      <a href="T4.html">T4</a>
      <a href="T5.html">T5</a>
      <a href="T6.html">T6</a>
    </div>
  
    <!-- Conteúdo -->
    <div class="content">
      <h1>Bem-vindo ao meu II Trimestre</h1>
      <p>Aqui você pode me acompanhar e saber mais sobre CSS.</p>
    </div>
  
</body>
</html>
